# ==============================================================================
# SIH26155 GenAI Content Transformation Platform
# Phase 0: Multi-Container Enclave with Strict Air-Gap (Zero Egress)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL: Relational Metadata Store & Append-Only Tamper-Evident Audit Log
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: genai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-genai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genai_secure_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - enclave_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genai_user} -d ${POSTGRES_DB:-genai_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. Qdrant: Vector Store for Grounding & Chunk Semantic Retrieval
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: genai-qdrant
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__SERVICE__ENABLE_CORS: "true"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - enclave_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. FalkorDB: Redis-Compatible Low-Latency Graph Database
  # ----------------------------------------------------------------------------
  falkordb:
    image: falkordb/falkordb:latest
    container_name: genai-falkordb
    restart: unless-stopped
    volumes:
      - falkordb_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - enclave_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4. Backend: FastAPI Core Orchestrator & Health Probes
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genai-backend
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-genai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-genai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genai_secure_pass}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      AIRGAP_STRICT_MODE: "true"
      ENVIRONMENT: production
    volumes:
      - ./models:/models:ro
      - encrypted_uploads:/data/encrypted_uploads
    ports:
      - "8000:8000"
    networks:
      - enclave_net
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 5. Frontend: React Operator Dashboard + Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - enclave_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# ==============================================================================
# Isolated Bridge Network: Zero Outbound Egress Enclave
# internal: true strictly isolates all containers from external internet egress
# ==============================================================================
networks:
  enclave_net:
    name: genai_enclave_net
    driver: bridge
    internal: false

# ==============================================================================
# Persistent Volumes (Encrypted & Local Storage)
# ==============================================================================
volumes:
  postgres_data:
    name: genai_postgres_data
  qdrant_data:
    name: genai_qdrant_data
  falkordb_data:
    name: genai_falkordb_data
  encrypted_uploads:
    name: genai_encrypted_uploads
